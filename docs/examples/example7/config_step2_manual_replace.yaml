# Step 2/2: same geometry as step 1, plus a deterministic, named-residue
# crosslink replacement (see Readme for how these targets were discovered).
geometry_generator: true
debug: true

species: "rattus_norvegicus"
pdb_file: "rattusnorvegicus_N_PYD_C_PYD.pdb"

# PYD: trivalent (3-residue) enzymatic crosslink.
crosslink: true
n_term_type: "PYD"
c_term_type: "PYD"
n_term_combination: "9.C - 5.B - 944.B"
c_term_combination: "1046.C - 1046.A - 103.C"

# Cα-Cα distance (Å) defining a crystal contact between chains.
contact_distance: 25
# Length of the assembled microfibril (nm).
fibril_length: 67.0

# Replace exactly this one PYD crosslink trio (model 58, chain B/C, residues
# 5/9/103) with LYS -- PYD's parent residue. All three must be listed
# together: they're one physical crosslink, not three independent residues.
replace_bool: true
manual_replacements:
  - "58.caps.pdb LYS 5 B"
  - "58.caps.pdb LYS 9 C"
  - "58.caps.pdb LYS 103 C"
