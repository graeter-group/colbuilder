# Step 1/3: standard sequence generation (no mutated_pdb) with terminal
# enzymatic crosslinks. Produces the base structure step 2 mutates further.
sequence_generator: true

species: "rattus_norvegicus"

# PYD: trivalent (3-residue) enzymatic crosslink, applied at both termini.
crosslink: true
n_term_type: "PYD"
c_term_type: "PYD"
n_term_combination: "9.C - 5.B - 944.B"
c_term_combination: "1046.C - 1046.A - 103.C"
