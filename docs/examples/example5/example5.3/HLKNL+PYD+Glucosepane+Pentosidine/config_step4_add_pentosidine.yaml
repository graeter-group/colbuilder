# Step 4/5: mutated-PDB workflow. Adds Pentosidine (non-enzymatic) on top of
# step 3's PYD structure.
sequence_generator: true

species: "rattus_norvegicus"
mutated_pdb: "rattusnorvegicus_N_PYD_C_PYD.pdb"

# Must match what's already in mutated_pdb, so colbuilder's crosslink-type
# validation recognizes PYD (already present) alongside Pentosidine (new).
crosslink: true
n_term_type: "PYD"
c_term_type: "PYD"
n_term_combination: "9.C - 5.B - 944.B"
c_term_combination: "1046.C - 1046.A - 103.C"

# The new crosslink to add, and where.
additional_1_type: "Pentosidine"
additional_1_combination: "523.A - 286.C"

# Which periodic unit-cell copies to search when optimizing the new
# crosslink's position (must be exactly 2, from D0-D5; default is D0/D5).
crosslink_copies: ["D2", "D1"]
