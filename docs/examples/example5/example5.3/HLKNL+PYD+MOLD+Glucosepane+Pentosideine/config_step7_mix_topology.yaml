# Step 7/7: mixing-only mode. Combines the three AGE-bearing structures from
# steps 2, 4, and 6 into one microfibril at a 60:20:20 ratio, then builds topology.
species: "rattus_norvegicus"
mix_bool: true
topology_generator: true
force_field: "amber99"

ratio_mix: "A:60 B:20 C:20"  # A = HLKNL+Glucosepane, B = PYD+Pentosidine, C = MOLD+Pentosidine
files_mix:
  - "rattusnorvegicus_N_HLKNL_C_HLKNL+ADD1_Glucosepane.pdb"   # A
  - "rattusnorvegicus_N_PYD_C_PYD+ADD1_Pentosidine.pdb"       # B
  - "rattusnorvegicus_N_MOLD_C_MOLD+ADD1_Pentosidine.pdb"     # C

# Cα-Cα distance (Å) defining a crystal contact between chains.
contact_distance: 25
# Length of the assembled microfibril (nm).
fibril_length: 67
