# Run all three stages in one pass: sequence -> geometry -> Martini3 topology.
sequence_generator: true
geometry_generator: true
topology_generator: true

species: "rattus_norvegicus"

# PYD: trivalent (3-residue) enzymatic crosslink. Martini3 crosslink
# parametrization currently only covers PYD and HLKNL.
crosslink: true
n_term_type: "PYD"
c_term_type: "PYD"
n_term_combination: "9.C - 5.B - 944.B"
c_term_combination: "1046.C - 1046.A - 103.C"

# Cα-Cα distance (Å) defining a crystal contact between chains.
contact_distance: 25
# Length of the assembled microfibril (nm).
fibril_length: 67.0

# Coarse-grained force field.
force_field: "martini3"
